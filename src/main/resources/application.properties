spring.application.name=ref-data-service
server.port=${SERVER_PORT:8381}

# --- DataSource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ref_data}
spring.datasource.username=${DB_USER:postgres}
# no default on purpose: credentials come only from the environment (.env locally, a Secret in Kubernetes)
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security: Keycloak ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8180/realms/patient-demo/protocol/openid-connect/certs}

# --- Kubernetes beginning ---
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s