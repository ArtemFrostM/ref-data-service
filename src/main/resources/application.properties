spring.application.name=ref-data-service
server.port=${SERVER_PORT:8381}

# --- DataSource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ref_data}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security: Keycloak ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8180/realms/patient-demo/protocol/openid-connect/certs}
